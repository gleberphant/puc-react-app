name: Deploy to GitHub Pages

on:
  push:
    branches: [master]


permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-slim
    steps:      
      - name: Install and Build
        working-directory: app-react
        run: |
          echo "Instalação dependencias e Build aplicação REACT..."
          npm install
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: app-react/build
          branch: gh-pages
