name: Deploy to GitHub Pages

on:
  push:
    branches: [master]


permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-slim
    steps:      
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install and Build
        run: |
          echo "Realizando Install e Build do projeto..."
          npm install
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages
